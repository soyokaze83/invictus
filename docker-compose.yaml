services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invictus-ingestion
    command: ["./ingestion"]
    env_file:
      - .env
    environment:
      LD_LIBRARY_PATH: /usr/local/lib
      POSTGRES_URL: postgres://postgres:postgres@central-postgres:5432/invictus?sslmode=disable
    ports:
      - "8081:8081"
    networks:
      - shared-db
    restart: unless-stopped

  # Query REST API service (in development)
  # server:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: invictus-server
  #   command: ["./server"]
