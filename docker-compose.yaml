  #     - .env
  #   environment:
  #     POSTGRES_URL: postgres://postgres:postgres@central-postgres:5432/invictus?sslmode=disable
  #   ports:
  #     - "8082:8082"
  #   networks:
  #     - shared-db
  #   restart: unless-stopped

networks:
  shared-db:
    external: true
