services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: invictus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invictus
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
