services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: invictus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invictus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invictus-ingestion
    command: ["./ingestion"]
    env_file:
      - .env
    environment:
      # ONNX Runtime library path for MiniLM provider
      LD_LIBRARY_PATH: /usr/local/lib
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped



